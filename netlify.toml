[build]
  # Plain HTML/CSS/JS site: no framework or compilation step.
  command = "echo 'PARFAITRANSIT: static site, no build required'"
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
